name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - run: yarn example:cli bundle:android
      - run: yarn example:cli bundle:ios
      - run: npm pack --dry-run

  publish-dev:
    name: Publish npm development build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-compatible npm version
        run: npm install --global npm@11.6.2
      - run: corepack enable
      - run: yarn install --immutable
      - name: Create unique development version
        run: npm version "$(node -p "require('./package.json').version.split('-')[0] + '-dev.' + process.env.GITHUB_RUN_ID")" --no-git-tag-version
      - name: Publish to npm
        run: npm publish --access public --tag dev
